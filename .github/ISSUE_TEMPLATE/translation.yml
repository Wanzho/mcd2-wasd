name: Translation fix
description: A word or sentence is wrong or sounds off in your language.
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Deutsch"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where you saw it
      multiple: true
      options:
        - Key layout editor
        - Mac app
        - Windows app
        - On-screen key list or banners in the game
        - Website
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What it says and what it should say
      description: The text as it is now and your correction. If the game itself uses a different name for a setting, say what the game calls it.
    validations:
      required: true
