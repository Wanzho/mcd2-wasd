/* Headings drawn bold the way Minecraft does it: the same letters again, one font pixel to the right (h1, icons). */

/* Layout: binding lists on the left, a sticky keyboard map, the game-settings checklist and the
   settings file on the right; one column on phones. Look: the game's own settings menus
   (deep teal, grey keycaps, orange tab underline). */
:root {
  --bg: #e9f0ef; --panel: #ffffff; --panel-2: #f3f7f6; --line: #cfdcdb; --fg: #13262c; --muted: #58727a;
  --accent: #d9801a; --accent-fg: #ffffff;
  --cap: #e4e8e8; --cap-edge: #a9b3b4; --cap-fg: #1a2226; --cap-empty: #f4f6f6;
  --move: #2f8fbf; --action: #d9801a; --menu: #3f9a55; --mod: #7d62d6; --danger: #cc3b33; --danger-bg: #fbe9e7;
  --ok: #2f8a4a; --ok-fg: #ffffff; --warn-bg: #fff4e0;
  --xa: #3f9a3f; --xb: #c7382f; --xx: #2f6fc0; --xy: #c9960e;
  --display: "Mojang", "Menlo", monospace; --body: "Chivo", "Helvetica Neue", Arial, sans-serif; --mono: "JetBrains Mono", "Menlo", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d2027; --panel: #122c35; --panel-2: #17363f; --line: #22505c; --fg: #e6f0f1; --muted: #8fb0b7;
  --accent: #f19a2e; --accent-fg: #1a1206;
  --cap: #d4d9d9; --cap-edge: #7f8c8e; --cap-fg: #1a2226; --cap-empty: #1d3f49;
  --move: #5bb5e0; --action: #f19a2e; --menu: #6cc27f; --mod: #a68cf0; --danger: #f06a5f; --danger-bg: #3a1d1d;
  --ok: #6cc27f; --ok-fg: #0f2414; --warn-bg: #3a2e14;
  --xa: #5cbf5c; --xb: #e0584f; --xx: #4f8fe0; --xy: #e8b83a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d2027; --panel: #122c35; --panel-2: #17363f; --line: #22505c; --fg: #e6f0f1; --muted: #8fb0b7;
  --accent: #f19a2e; --accent-fg: #1a1206;
  --cap: #d4d9d9; --cap-edge: #7f8c8e; --cap-fg: #1a2226; --cap-empty: #1d3f49;
  --move: #5bb5e0; --action: #f19a2e; --menu: #6cc27f; --mod: #a68cf0; --danger: #f06a5f; --danger-bg: #3a1d1d;
  --ok: #6cc27f; --ok-fg: #0f2414; --warn-bg: #3a2e14;
  --xa: #5cbf5c; --xb: #e0584f; --xx: #4f8fe0; --xy: #e8b83a; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); margin: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; border-bottom: 3px solid var(--accent); padding-bottom: 14px; }
h1 { font: 400 32px/1.25 var(--display); margin: 0; text-shadow: .125em 0 0 currentColor; letter-spacing: .125em; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
button, .btn { font: 600 13px/1 var(--body); border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 9px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.primary.save { background: var(--ok); color: var(--ok-fg); border-color: var(--ok); }
/* layouts: pick, create, save, reset, download */
.layoutbar { display: grid; gap: 6px; justify-items: start; }
.layoutbar .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
.layoutbar .btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.layoutbar select { font: 600 14px/1 var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-width: 13rem; }
.layoutbar select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.layoutbar button:disabled { opacity: .45; cursor: default; }
.layout-status { font-size: 13px; color: var(--muted); min-height: 1.6em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.layout-status button { padding: 5px 9px; }
.layout-status .changed { color: var(--accent); font-weight: 600; }
.layout-status .warn { color: var(--danger); font-weight: 600; }
.namebox { font: 600 13px var(--body); color: var(--fg); background: var(--panel-2); border: 1px solid var(--accent); border-radius: 4px; padding: 5px 8px; width: 13rem; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 20px; margin-top: 18px; align-items: start; }
@media (max-width: 1020px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-height: calc(100vh - 24px); overflow: auto; }
.grid > *, .side > *, main > * { min-width: 0; }
@media (max-width: 1020px) { .side { position: static; max-height: none; } }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px 16px; }
.card + .card { margin-top: 16px; }
h2 { font: 400 16px/1.5 var(--display); margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
h2 .dot { width: 10px; height: 10px; border-radius: 2px; }

<script>
"use strict";
// =================================================================== languages
// The page in every language the game has. English is the key: t("Move up") is the
// current language's text for it, or the English when it has none. The other
// languages are the "editor" part of lang/<code>.json, built in here by build.sh.
const LANGS = { en: { name: "English", t: {} } }; // build.sh puts the languages here
const _ = s => s; // marks text that t() translates where it's shown
let lang = "en";
function matchLang(tag) {
  const s = String(tag || "").toLowerCase().replace(/_/g, "-"), pick = code => LANGS[code] ? code : null;
  if (!s) return null;
  if (/^zh-(hant|tw|hk|mo)\b/.test(s)) return pick("zh-Hant");
  if (/^zh\b/.test(s)) return pick("zh-Hans");
  return Object.keys(LANGS).find(c => c.toLowerCase() === s.split("-")[0]) || null;
}
const tr = s => { const v = LANGS[lang] && LANGS[lang].t[s]; return typeof v === "string" && v ? v : s; };
const fill = (s, vars) => vars ? s.replace(/\{(\w+)\}/g, (m, k) => k in vars ? String(vars[k]) : m) : s;
const t = (s, vars) => fill(tr(s), vars);
// Text with a number in it: English has a "one" and an "other" form, other languages their
// own (Intl.PluralRules), and "=1" where one item reads differently.
function tn(one, other, n, vars) {
  const v = LANGS[lang] && LANGS[lang].t[other];
  let s = n === 1 ? one : other;
  if (typeof v === "string" && v) s = v;
  else if (v && typeof v === "object") { let c = "other"; try { c = new Intl.PluralRules(lang).select(n); } catch (e) {} s = v["=" + n] || v[c] || v.other || s; }
  return fill(s, { ...vars, n });
}
const andList = items => { try { return new Intl.ListFormat(lang, { type: "conjunction" }).format(items); } catch (e) { return items.join(", "); } };

// =================================================================== the game's actions
// Every row is one of the game's actions. Movement and fights always go through the
// virtual controller (pad). Menus the game has both ways (kb + pad) are switchable; a
// keyboard route sends the game's own keyboard shortcut ("game key"):
//   menu: opens a screen, so the mod switches to mouse mode
//   pass: an instant action (teleports), no mode change
//   back: Esc, the game menu / back
// `game` is the action's name in the game's Settings › Controls › Keyboard.
const PAD_NAMES = { A: "A", B: "B", X: "X", Y: "Y", LB: "LB", RB: "RB", LT: "LT", RT: "RT", LS: _("L-stick click"), RS: _("R-stick click"),
  DUp: _("D-pad ↑"), DDown: _("D-pad ↓"), DLeft: _("D-pad ←"), DRight: _("D-pad →"), Back: _("View"), Start: _("Menu") };
const padName = b => t(PAD_NAMES[b]);
const ACTIONS = [
  { id: "up", sec: "act", cat: "move", label: _("Move up"), move: "Up", badge: _("L-stick") },
  { id: "left", sec: "act", cat: "move", label: _("Move left"), move: "Left", badge: _("L-stick") },
  { id: "down", sec: "act", cat: "move", label: _("Move down"), move: "Down", badge: _("L-stick") },
  { id: "right", sec: "act", cat: "move", label: _("Move right"), move: "Right", badge: _("L-stick") },
  { id: "dodge", sec: "act", cat: "move", label: _("Directional dodge"), sub: _("click: dodge the way you're moving · click, drag, release: roll that way"), move: "DodgeMouse", badge: _("R-stick"), game: _("Directional Dodge") },
  { id: "fdodge", sec: "act", cat: "move", label: _("Forward dodge"), sub: _("quick dodge the way you face"), pad: "LB", game: _("Forward Dodge") },
  { id: "jump", sec: "act", cat: "action", label: _("Jump / interact"), pad: "A", game: _("Jump") },
  { id: "melee", sec: "act", cat: "action", label: _("Melee"), sub: _("in the air: heavy jump attack"), pad: "X", game: _("Interact, Melee Attack") },
  { id: "ranged", sec: "act", cat: "action", label: _("Ranged (bow)"), sub: _("hold a mouse button to aim with the mouse"), pad: "RT", game: _("Ranged Attack") },
  { id: "art1", sec: "act", cat: "action", label: _("Artifact 1"), pad: "Y", game: _("Artifact 1") },
  { id: "art2", sec: "act", cat: "action", label: _("Artifact 2"), pad: "B", game: _("Artifact 2") },
  { id: "art3", sec: "act", cat: "action", label: _("Artifact 3"), pad: "RB", game: _("Artifact 3") },
  { id: "potion", sec: "act", cat: "action", label: _("Health potion"), pad: "LT", game: _("Health Potion") },
  { id: "trail", sec: "act", cat: "action", label: _("Guidance trail"), pad: "LS", game: _("Guidance Trail") },
  { id: "tpplayer", sec: "act", cat: "action", label: _("Teleport to player"), pad: "DLeft", kb: "pass", game: _("Teleport To Player"), group: _("Teleports") },
  { id: "statue", sec: "act", cat: "action", label: _("Teleport statue"), kb: "pass", game: _("Teleport Statue") },
  { id: "tp1", sec: "act", cat: "action", label: _("Teleport to player 1"), kb: "pass", game: _("Teleport To Player 1") },
  { id: "tp2", sec: "act", cat: "action", label: _("Teleport to player 2"), kb: "pass", game: _("Teleport To Player 2") },
  { id: "tp3", sec: "act", cat: "action", label: _("Teleport to player 3"), kb: "pass", game: _("Teleport To Player 3") },
  { id: "tp4", sec: "act", cat: "action", label: _("Teleport to player 4"), kb: "pass", game: _("Teleport To Player 4") },
  { id: "inventory", sec: "menu", cat: "menu", label: _("Inventory"), sub: _("tap: full inventory · hold: mini inventory"), pad: "DUp", kb: "menu", opens: true, game: _("Inventory, Mini Inventory") },
  { id: "map", sec: "menu", cat: "menu", label: _("World map"), pad: "Back", kb: "menu", opens: true, game: _("World Map") },
  { id: "wheel", sec: "menu", cat: "menu", label: _("Menu wheel"), pad: "Start", kb: "menu", opens: true, game: _("Menu Wheel") },
  { id: "quest", sec: "menu", cat: "menu", label: _("Quest log / track quest"), sub: _("tap: track · hold: quest log"), pad: "DRight", kb: "menu", game: _("Quest Log, Track Quest") },

  const uses = usage(state);
  renderSection("sec-act", "var(--action)", t("Movement & Actions"),
    t("Always the controller: the game only sees controller input while you fight. \"{ingame}\" is the game's own keyboard key for the same action; match it to yours (see the checklist) so keyboard mode feels the same.", { ingame: t("in game") }),
    ACTIONS.filter(a => a.sec === "act"), uses);
  renderSection("sec-menu", "var(--menu)", t("Menus"),
    t("For menus the game has both ways, pick one. {keyboard} (default): your keys send the game's own shortcut and switch to mouse mode. {controller}: your keys press the controller button; the inventory then opens with a tap and shows the mini inventory while held, so you can keep moving. Only the chosen way is active; the other stays off.", { keyboard: t("Keyboard"), controller: t("Controller") }),
    ACTIONS.filter(a => a.sec === "menu"), uses);
  renderWheelNote();
  renderMod(uses); renderTune(); renderRecs(); renderMismatch(); renderMap(uses); renderConflicts(uses); renderLayoutBar(); renderOut();
}

// ---------------------------------------------------------------- language
// The page's fixed text (data-t: text, data-tx: text with <b>/<code>, data-t-title,
// data-t-aria, data-t-placeholder), the buttons that depend on the app, and the picker.
function translatePage() {
  document.documentElement.lang = lang;
  document.title = t("Dungeons II Keybinder");
  for (const e of document.querySelectorAll("[data-t]")) e.textContent = t(e.dataset.t);
  for (const e of document.querySelectorAll("[data-tx]")) e.replaceChildren(tx(e.dataset.tx));
  for (const e of document.querySelectorAll("[data-t-title]")) e.title = t(e.dataset.tTitle);
  for (const e of document.querySelectorAll("[data-t-aria]")) e.setAttribute("aria-label", t(e.dataset.tAria));
  for (const e of document.querySelectorAll("[data-t-placeholder]")) e.placeholder = t(e.dataset.tPlaceholder);
  $("drop").replaceChildren(tx("Drop a settings file here, or {choose}", { choose: el("label", { style: "text-decoration:underline;cursor:pointer" }, t("choose one"), $("fileInput")) }));
  $("downloadTop").textContent = host ? t("Save to game") : t("Download file");
  $("downloadTop").title = host ? t("Save this layout into the game folder") : t("Download the settings file for the game folder");
  $("saveBtn").textContent = host ? t("Save to game") : t("Download settings file");
  $("langSel").replaceChildren(...Object.entries(LANGS).map(([code, l]) => el("option", { value: code }, l.name)));
  $("langSel").value = lang;
}
$("langSel").addEventListener("change", e => {
  const code = e.target.value;
  if (!LANGS[code] || code === lang) return;
  lang = code; store.set("d2kb-lang", code);
  if (host && host.setLang) host.setLang(code); // the app's own buttons follow
  translatePage(); render();
});

// ---------------------------------------------------------------- key capture
let capturing = null;
function startCapture(target, btn) {
  capturing = { target, btn };
  btn.classList.add("listening");
  $("capTitle").textContent = target.kind === "game" ? t("The game's key for {row}", { row: target.rowName }) : t("Press a key for {row}", { row: target.rowName });
  $("capFor").textContent = target.kind === "game" ? t("Press the key the game has for this in Settings › Controls › Keyboard, or click a mouse button in this box.") : t("…or click a mouse button inside this box.");
  $("capMsg").textContent = "";
  $("capture").hidden = false;
  $("capCancel").focus();
}
function stopCapture() {
  if (capturing) capturing.btn.classList.remove("listening");
  capturing = null; $("capture").hidden = true;
}
function take(key) {
  const tgt = capturing.target;
  if (tgt.kind === "game") { const arr = state.game[tgt.a.id] = state.game[tgt.a.id] || []; arr[tgt.slot || 0] = key; stopCapture(); changed(); return; }
  if (tgt.keys.includes(key)) { $("capMsg").textContent = t("{key} is already on this row.", { key: pretty(key) }); return; }
  if (tgt.kbRoute && isMouse(key)) { $("capMsg").textContent = t("A mouse button can't send a keyboard shortcut. Pick a key, or switch this row to the controller."); return; }
  if (tgt.kbRoute && (key === "=" || key === ";")) { $("capMsg").textContent = t("That key can't be sent to the game. Pick another."); return; }
  tgt.set([...tgt.keys, key]);
  stopCapture(); changed();
}
window.addEventListener("keydown", e => {
  if (!capturing) return;
  e.preventDefault(); e.stopPropagation();
  if (e.key === "Meta" || e.code.startsWith("Meta") || e.code.startsWith("OS")) { $("capMsg").textContent = t("⌘ Command is kept for system shortcuts and can't be bound."); return; }
  let k = CODE_NAMES[e.code];
  if (!k) { const m = /^(Key|Digit)(.)$/.exec(e.code) || /^Numpad(\d)$/.exec(e.code); if (m) k = m[m.length - 1]; }
  if (!k) { const f = /^F(\d{1,2})$/.exec(e.code); if (f && +f[1] <= 12) k = "F" + f[1]; }
  if (!k) { $("capMsg").textContent = t("The mod can't use {key}. Try another key.", { key: e.key || e.code }); return; }
  take(k);
}, true);
$("capture").addEventListener("mousedown", e => {
  if (!capturing || e.target.id === "capCancel") return;
  if (!e.target.closest(".box")) return;
  e.preventDefault();
  const k = ["Mouse1", "Mouse3", "Mouse2", "Mouse4", "Mouse5"][e.button];
  if (k) take(k);
});
for (const type of ["contextmenu", "auxclick", "mouseup"]) $("capture").addEventListener(type, e => { if (capturing || !$("capture").hidden) e.preventDefault(); });
$("capCancel").addEventListener("click", e => { e.stopPropagation(); stopCapture(); });

// ---------------------------------------------------------------- layouts
// Built-in layouts (Default, Recommended) and your own, kept in this browser.
// A changed built-in layout can be saved as a new one of yours; Reset goes back to
// the selected layout's saved version. The page also keeps what's on screen.
let layouts = [];               // your layouts: [{ id, name, text }]
let cur = "default", base = ""; // the selected layout, and its saved settings text
let naming = null, switchWarn = false, confirmReset = false;
const layoutName = id => BUILTIN[id] ? t(BUILTIN[id].name) : (layouts.find(l => l.id === id) || {}).name || t("Layout");
const layoutText = id => BUILTIN[id] ? BUILTIN[id].text : (layouts.find(l => l.id === id) || {}).text;
const dirty = () => iniText(state) !== base;
function persist() { store.set("d2kb-ini", iniText(state)); store.set("d2kb-layouts", JSON.stringify(layouts)); store.set("d2kb-current", cur); }
function save() { persist(); }
function edited() { switchWarn = false; confirmReset = false; renderLayoutBar(); }
function changed() { switchWarn = false; confirmReset = false; save(); render(); }
function selectLayout(id) {
  const text = layoutText(id); if (!text) return;
  state = stateFromIni(text); cur = id; base = iniText(state); naming = null; switchWarn = false;
  render(); persist();
}
function newLayout(name) {
  const id = "l" + Date.now().toString(36);
  const text = iniText(state);
  layouts.push({ id, name, text });
  cur = id; base = text; naming = null; switchWarn = false;
  render(); persist();
  $("saveStatus").textContent = host ? t("Saved \"{name}\". Save it to the game to use it.", { name }) : t("Saved \"{name}\". Download the file to use it in the game.", { name });
}
function saveChanges() {
  if (BUILTIN[cur]) { naming = "save"; renderLayoutBar(); return; } // built-in layouts stay as they are
  const l = layouts.find(x => x.id === cur); if (!l) return;
  l.text = iniText(state); base = l.text; switchWarn = false; render(); persist();
}
function resetLayout() { state = stateFromIni(base); naming = null; switchWarn = false; confirmReset = false; render(); persist(); }
function askReset() { if (!dirty()) return; confirmReset = true; naming = null; switchWarn = false; renderLayoutBar(); }
function deleteLayout() { layouts = layouts.filter(l => l.id !== cur); selectLayout("default"); }
$("layoutSel").addEventListener("change", e => {
  const v = e.target.value;
  if (v === "__import") { $("importCard").hidden = false; $("importCard").scrollIntoView({ behavior: "smooth", block: "start" }); renderLayoutBar(); return; }
  if (dirty()) { switchWarn = true; renderLayoutBar(); return; }
  selectLayout(v);
});
$("createBtn").addEventListener("click", () => { naming = "create"; switchWarn = false; confirmReset = false; renderLayoutBar(); });
$("resetBtn").addEventListener("click", askReset);
function importText(text, from) {
  if (!/\[(Move|Buttons|Keys)\]/i.test(text)) { $("importStatus").textContent = t("That doesn't look like a WASD mod settings file."); return; }
  if (dirty() && !BUILTIN[cur]) saveChanges(); // keep unsaved edits to your layout before switching
  state = stateFromIni(text);
  newLayout(String(from).replace(/\.(txt|ini)$/i, "") || t("Imported layout"));
  $("importCard").hidden = true;
  $("importStatus").textContent = ""; $("saveStatus").textContent = t("Imported {file} as a layout of yours.", { file: from });
}
$("importBtn").addEventListener("click", () => importText($("importText").value, t("Pasted layout")));
$("fileInput").addEventListener("change", e => { const f = e.target.files[0]; if (f) f.text().then(text => importText(text, f.name)); });
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) f.text().then(text => importText(text, f.name)); });

async function copy(text, okMsg) {
  try { await navigator.clipboard.writeText(text); $("saveStatus").textContent = okMsg; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("iniOut")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("saveStatus").textContent = t("Copy isn't allowed here. The text is selected: press ⌘C (Ctrl+C)."); }
}
$("copyBtn").addEventListener("click", () => copy(iniText(state), t("Copied. Paste it into a wasdmod.txt in the game folder.")));
$("copyPath").addEventListener("click", () => copy($("gamePath").textContent, t("Folder path copied.")));

// Saving: inside Claude the viewer's download prompt, opened as a local file a normal
// download: default.txt or author.txt for an unedited built-in layout, otherwise
// wasdmod-MMDDYY.txt. The mod uses the newest of them.
let downloads = null;
const fileName = () => {
  if (BUILTIN[cur] && !dirty()) return BUILTIN[cur].file;
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return "wasdmod-" + p(d.getMonth() + 1) + p(d.getDate()) + p(d.getFullYear() % 100) + ".txt";
};
async function downloadFile() {
  const text = iniText(state), name = fileName();
  if (host) {
    $("saveStatus").textContent = t("Saving…");
    try {
      const used = await host.save(name, text);
      $("saveStatus").textContent = used && used !== name ? t("Saved to the game as {file}. The game still uses {used} (it's newer).", { file: name, used }) : t("Saved to the game as {file}. Restart the game to use it.", { file: name });
    } catch (e) {
      // "saved:" starts the app's messages for a file that was saved but can't be used yet.
      const m = String(e && e.message || e);
      $("saveStatus").textContent = m.startsWith("saved:") ? m.slice(6) : t("Not saved: {error}", { error: m });
    }
    return;
  }
  if (downloads) {
    try { await downloads.save({ filename: name, data: text }); $("saveStatus").textContent = t("Saved {file}. Load it with wasdmod-Windows.exe (Load layout file) or move it into the game's Win64 folder, then restart the game. On a Mac, the wasdmod app has this editor built in.", { file: name }); }
    catch (e) { $("saveStatus").textContent = e && e.code === "declined" ? t("Not saved.") : t("Saving isn't available here. Use Copy text instead."); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  $("saveStatus").textContent = t("Downloaded {file}. Load it with wasdmod-Windows.exe (Load layout file) or move it into the game's Win64 folder, then restart the game. On a Mac, the wasdmod app has this editor built in.", { file: name });
}
$("saveBtn").addEventListener("click", downloadFile);
$("downloadTop").addEventListener("click", () => { downloadFile(); $("saveStatus").scrollIntoView({ behavior: "smooth", block: "nearest" }); });
if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
if (host) $("whereItGoes").hidden = true;

try { layouts = JSON.parse(store.get("d2kb-layouts") || "[]"); } catch (e) { layouts = []; }
cur = store.get("d2kb-current") || "default";
const working = store.get("d2kb-ini");
if (!store.get("d2kb-layouts") && working) {
  // Edits from the previous version of this page become a layout of yours.
  let old = null; try { old = JSON.parse(store.get("d2kb-profile") || "null"); } catch (e) {}
  if (old && !old.edited && BUILTIN[old.id]) cur = old.id;
  else { layouts.push({ id: "l" + Date.now().toString(36), name: t("My layout"), text: working }); cur = layouts[0].id; }
}
if (!layoutText(cur)) cur = "default";
base = iniText(stateFromIni(layoutText(cur)));
state = stateFromIni(working || layoutText(cur));
translatePage(); render(); persist();
}
</script>
